services:
  - type: web
    name: sri-balaji-gears
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://www.sribalajigears.com
      - key: ERP_EMAIL
        value: erp@sribalajigears.com
      - key: COMPANY_NAME
        value: Sri Balaji Gears
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MAX_UPLOAD_SIZE_MB
        value: "15"
      - key: SMTP_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: smtp.rediffmailpro.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: erp@sribalajigears.com
      - key: SMTP_PASS
        value: sbgerp@2026
      - key: SMTP_SECURE
        value: ssl
      - key: SMTP_FROM_EMAIL
        value: erp@sribalajigears.com
      - key: SMTP_FROM_NAME
        value: Sri Balaji Gears RFQ Portal
