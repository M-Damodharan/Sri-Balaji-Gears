services:
  - type: web
    name: sri-balaji-gears
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://www.sribalajigears.com
      - key: ERP_EMAIL
        value: erp@sribalajigears.com
      - key: COMPANY_NAME
        value: Sri Balaji Gears
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MAX_UPLOAD_SIZE_MB
        value: "15"
      - key: SMTP_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: tls
      - key: SMTP_FROM_EMAIL
        value: erp@sribalajigears.com
      - key: SMTP_FROM_NAME
        value: Sri Balaji Gears RFQ Portal
