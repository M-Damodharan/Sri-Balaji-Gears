<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe494"/>
      <stop offset="50%" stop-color="#efad2d"/>
      <stop offset="100%" stop-color="#b67308"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Certificate Border & Plaque -->
  <rect width="720" height="500" rx="16" fill="#0f1e31"/>
  <rect x="36" y="26" width="648" height="448" rx="8" fill="url(#bgP)"/>
  <rect x="52" y="42" width="616" height="416" rx="4" fill="none" stroke="#cfab5b" stroke-width="2.5"/>
  <rect x="58" y="48" width="604" height="404" rx="2" fill="none" stroke="#e2c78a" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- Official Seal Badge -->
  <g filter="url(#badgeShadow)">
    <path d="M360 62 L378 80 L404 76 L412 101 L436 113 L425 137 L436 161 L412 173 L404 198 L378 194 L360 212 L342 194 L316 198 L308 173 L284 161 L295 137 L284 113 L308 101 L316 76 L342 80 Z" fill="url(#goldRibbon)"/>
    <circle cx="360" cy="137" r="42" fill="#0f1e31" stroke="#ffffff" stroke-width="2"/>
    <circle cx="360" cy="137" r="36" fill="none" stroke="#efad2d" stroke-width="1.5" stroke-dasharray="4 2"/>
    <!-- Checkmark Icon -->
    <path d="M344 136 L355 148 L378 123" fill="none" stroke="#ffd875" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Header Texts -->
  <text x="360" y="228" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="6" fill="#4a5568">SRI BALAJI GEARS</text>
  <text x="360" y="278" font-family="'Barlow Condensed', Arial, sans-serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="1" fill="#0f1e31">IATF 16949:2016</text>
  <line x1="160" y1="298" x2="560" y2="298" stroke="#d5b66e" stroke-width="2"/>

  <!-- Subtitle & Scope Details -->
  <text x="360" y="335" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#2d3748">Automotive Quality Management System</text>
  <text x="360" y="364" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#718096">Scope: Manufacture of Welded Automotive Assemblies &amp; Bus Seating Frames</text>

  <!-- Accreditation & Verification Badge -->
  <g transform="translate(250, 396)">
    <rect width="220" height="30" rx="15" fill="#0f1e31" stroke="#d5b66e" stroke-width="1"/>
    <circle cx="22" cy="15" r="5" fill="#efad2d"/>
    <text x="122" y="19" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.5" fill="#ffd875">AUTOMOTIVE CERTIFIED</text>
  </g>
</svg>
