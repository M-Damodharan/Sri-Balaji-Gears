<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Certificate Border & Plaque -->
  <rect width="720" height="500" rx="16" fill="#0f1e31"/>
  <rect x="36" y="26" width="648" height="448" rx="8" fill="url(#bgP)"/>
  <rect x="52" y="42" width="616" height="416" rx="4" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="58" y="48" width="604" height="404" rx="2" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- Official Seal Badge (Safety Shield Motif) -->
  <g filter="url(#badgeShadow)">
    <path d="M360 62 L378 80 L404 76 L412 101 L436 113 L425 137 L436 161 L412 173 L404 198 L378 194 L360 212 L342 194 L316 198 L308 173 L284 161 L295 137 L284 113 L308 101 L316 76 L342 80 Z" fill="url(#cyanRibbon)"/>
    <circle cx="360" cy="137" r="42" fill="#0f1e31" stroke="#ffffff" stroke-width="2"/>
    <circle cx="360" cy="137" r="36" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <!-- Safety Shield Emblem -->
    <path d="M346 126 L360 120 L374 126 C374 142 360 154 360 154 C360 154 346 142 346 126 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Header Texts -->
  <text x="360" y="228" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="6" fill="#4a5568">SRI BALAJI GEARS</text>
  <text x="360" y="278" font-family="'Barlow Condensed', Arial, sans-serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="1" fill="#0f1e31">ISO 45001:2018</text>
  <line x1="160" y1="298" x2="560" y2="298" stroke="#0284c7" stroke-width="2"/>

  <!-- Subtitle & Scope Details -->
  <text x="360" y="335" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0369a1">Occupational Health &amp; Safety Management System (OHSMS)</text>
  <text x="360" y="364" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#718096">Scope: Welder Protection, Ergonomic Jigs, Shopfloor 5S &amp; Risk Mitigation</text>

  <!-- Accreditation & Verification Badge -->
  <g transform="translate(210, 396)">
    <rect width="300" height="32" rx="16" fill="#0f1e31" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="24" cy="16" r="4.5" fill="#38bdf8"/>
    <text x="164" y="16" dominant-baseline="central" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8" fill="#7dd3fc">HEALTH &amp; SAFETY STANDARD</text>
  </g>
</svg>
