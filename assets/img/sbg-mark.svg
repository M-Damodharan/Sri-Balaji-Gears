<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="goldGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd875"/>
      <stop offset="50%" stop-color="#efad2d"/>
      <stop offset="100%" stop-color="#b67308"/>
    </linearGradient>
    <radialGradient id="hubGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14263c"/>
      <stop offset="100%" stop-color="#07111e"/>
    </radialGradient>
    <filter id="gearGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#efad2d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 16-tooth precision industrial gear silhouette -->
  <g filter="url(#gearGlow)">
    <path d="M60 6 L69 19 L85 14 L91 30 L108 34 L105 51 L120 60 L105 69 L108 86 L91 90 L85 106 L69 101 L60 114 L51 101 L35 106 L29 90 L12 86 L15 69 L0 60 L15 51 L12 34 L29 30 L35 14 L51 19 Z" fill="url(#goldGear)"/>
  </g>
  <!-- Central Hub -->
  <circle cx="60" cy="60" r="38" fill="url(#hubGrad)" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="33" fill="none" stroke="#efad2d" stroke-width="1.2" stroke-dasharray="4 2"/>
  <!-- Central Monogram -->
  <text x="60" y="68" fill="#ffffff" text-anchor="middle" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-weight="900" font-size="24" letter-spacing="1.5">SBG</text>
</svg>
