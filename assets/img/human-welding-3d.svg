<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <!-- Background & Ambient Atmosphere -->
    <radialGradient id="envGlowHuman" cx="62%" cy="62%" r="78%">
      <stop offset="0%" stop-color="#182e4e"/>
      <stop offset="42%" stop-color="#0a1829"/>
      <stop offset="100%" stop-color="#040912"/>
    </radialGradient>
    <radialGradient id="arcCoreHuman" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#d4f7ff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hotSpotHuman" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffe494"/>
      <stop offset="65%" stop-color="#efad2d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#efad2d" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Leather & Apparel Shading -->
    <linearGradient id="leatherSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="80%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="heavyApron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="helmetShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#09111c"/>
    </linearGradient>
    <linearGradient id="visorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="steelTubeHuman" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="55%" stop-color="#64748b"/>
      <stop offset="85%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowArcHuman" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowHuman" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="900" height="620" rx="20" fill="url(#envGlowHuman)"/>

  <!-- Isometric Shopfloor Grid -->
  <g opacity="0.22" stroke="#38bdf8" stroke-width="1.2">
    <line x1="50" y1="570" x2="850" y2="570"/>
    <line x1="70" y1="530" x2="830" y2="530"/>
    <line x1="100" y1="495" x2="800" y2="495"/>
    <line x1="130" y1="465" x2="770" y2="465"/>
    <line x1="100" y1="620" x2="350" y2="420"/>
    <line x1="220" y1="620" x2="410" y2="420"/>
    <line x1="360" y1="620" x2="480" y2="420"/>
    <line x1="520" y1="620" x2="560" y2="420"/>
    <line x1="680" y1="620" x2="630" y2="420"/>
    <line x1="820" y1="620" x2="700" y2="420"/>
  </g>

  <!-- Ground Shadows -->
  <ellipse cx="260" cy="550" rx="130" ry="26" fill="#000000" opacity="0.7" filter="url(#glowArcHuman)"/>
  <ellipse cx="640" cy="535" rx="180" ry="32" fill="#000000" opacity="0.75" filter="url(#glowArcHuman)"/>

  <!-- ==========================================
       ISOMETRIC 3D MODULAR FIXTURE TABLE & CLAMPS
       ========================================== -->
  <g id="table3D" filter="url(#shadowHuman)">
    <!-- 3D Table Top Plate -->
    <!-- Top Face -->
    <polygon points="410,440 790,420 850,465 470,485" fill="#243447" stroke="#475569" stroke-width="1.5"/>
    <!-- Front Face -->
    <polygon points="470,485 850,465 850,500 470,520" fill="#131e2b" stroke="#334155" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="410,440 470,485 470,520 410,475" fill="#1b293a" stroke="#334155" stroke-width="1.5"/>

    <!-- Grid Holes on Modular Table -->
    <g fill="#0b131e" stroke="#38bdf8" stroke-width="0.8" opacity="0.4">
      <ellipse cx="490" cy="466" rx="4" ry="2"/>
      <ellipse cx="550" cy="462" rx="4" ry="2"/>
      <ellipse cx="610" cy="458" rx="4" ry="2"/>
      <ellipse cx="670" cy="454" rx="4" ry="2"/>
      <ellipse cx="730" cy="450" rx="4" ry="2"/>
      <ellipse cx="790" cy="446" rx="4" ry="2"/>
      <ellipse cx="520" cy="478" rx="4" ry="2"/>
      <ellipse cx="580" cy="474" rx="4" ry="2"/>
      <ellipse cx="640" cy="470" rx="4" ry="2"/>
      <ellipse cx="700" cy="466" rx="4" ry="2"/>
      <ellipse cx="760" cy="462" rx="4" ry="2"/>
      <ellipse cx="820" cy="458" rx="4" ry="2"/>
    </g>

    <!-- Heavy Table Legs -->
    <rect x="485" y="515" width="22" height="45" fill="#172332" stroke="#334155"/>
    <rect x="820" y="495" width="22" height="55" fill="#101925" stroke="#334155"/>
    <rect x="425" y="470" width="20" height="52" fill="#172332" stroke="#334155"/>
    <rect x="765" y="450" width="20" height="50" fill="#101925" stroke="#334155"/>
  </g>

  <!-- 3D Welded Automotive Frame Under Construction -->
  <g id="workpiece" filter="url(#shadowHuman)">
    <!-- Base Runner Tubes -->
    <path d="M480 455 L730 440 L755 460 L505 475 Z" fill="url(#steelTubeHuman)" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Vertical Frame Tubes -->
    <path d="M510 456 L510 360 L530 358 L530 454 Z" fill="url(#steelTubeHuman)" stroke="#94a3b8" stroke-width="2"/>
    <path d="M700 442 L700 345 L720 343 L720 440 Z" fill="url(#steelTubeHuman)" stroke="#94a3b8" stroke-width="2"/>
    <path d="M605 450 L605 352 L625 350 L625 448 Z" fill="url(#steelTubeHuman)" stroke="#94a3b8" stroke-width="2"/>

    <!-- Top Tubular Crossmember -->
    <path d="M505 360 Q615 342 725 345 L725 358 Q615 355 505 373 Z" fill="url(#steelTubeHuman)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Heavy Gusset Plate Being Welded -->
    <polygon points="600,410 650,402 650,448 600,450" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Modular Toggle Clamps Holding Frame -->
    <rect x="495" y="430" width="14" height="26" fill="#efad2d" stroke="#b45309" stroke-width="1"/>
    <rect x="715" y="415" width="14" height="26" fill="#efad2d" stroke="#b45309" stroke-width="1"/>
  </g>

  <!-- ==========================================
       3D REALISTIC MASTER WELDER FIGURE
       ========================================== -->
  <g id="masterWelder" filter="url(#shadowHuman)">
    <!-- Safety Boots & Heavy Work Trousers -->
    <!-- Left Leg -->
    <path d="M220 430 L275 435 L260 550 L205 550 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Right Leg (Forward Stance) -->
    <path d="M285 435 L345 450 L335 555 L275 555 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Steel Toe Boots -->
    <path d="M198 542 H262 L258 565 H175 Q168 555 198 542" fill="#09111c" stroke="#475569" stroke-width="2"/>
    <path d="M272 546 H338 L352 568 H270 Z" fill="#09111c" stroke="#475569" stroke-width="2"/>

    <!-- Volumetric Leather Welding Jacket (Torso) -->
    <path d="M190 220 L315 210 L375 330 L345 440 L185 430 L160 325 Z" fill="url(#leatherSuit)" stroke="#b45309" stroke-width="3"/>
    <!-- Heavy Leather Protective Front Apron -->
    <path d="M215 260 L295 255 L320 435 L200 430 Z" fill="url(#heavyApron)" stroke="#334155" stroke-width="2"/>
    <!-- Collar & Neck Shroud -->
    <path d="M230 195 L285 190 L300 230 L215 235 Z" fill="#78350f" stroke="#b45309" stroke-width="2"/>

    <!-- Left Arm & Support Hand on Fixture -->
    <!-- Upper Arm -->
    <path d="M185 240 L140 310 L185 365 L225 320 Z" fill="url(#leatherSuit)" stroke="#92400e" stroke-width="2.5"/>
    <!-- Forearm extending toward table for stability -->
    <path d="M150 320 L380 410 L410 395 L190 315 Z" fill="url(#leatherSuit)" stroke="#78350f" stroke-width="2.5"/>
    <!-- Left Heavy Welding Gauntlet Steadying the Gun -->
    <path d="M380 395 L435 410 L440 430 L395 435 Z" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <!-- Fingers wrapped near nozzle guide -->
    <ellipse cx="430" cy="418" rx="10" ry="14" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Right Arm (Active Torch Gripping Arm) -->
    <!-- Shoulder & Bicep -->
    <path d="M305 230 L390 270 L430 350 L370 365 Z" fill="url(#leatherSuit)" stroke="#92400e" stroke-width="2.5"/>
    <!-- Forearm leading to torch handle -->
    <path d="M390 320 L550 375 L540 410 L380 365 Z" fill="url(#leatherSuit)" stroke="#78350f" stroke-width="2.5"/>
    <!-- Right Gauntlet Glove -->
    <path d="M525 370 L580 385 L570 425 L518 410 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>

    <!-- Professional Ergonomic MIG Welding Torch -->
    <path d="M555 390 L625 412 L618 426 L550 404 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Curved Swan Neck -->
    <path d="M625 412 Q645 418 660 410 L655 422 Q640 428 618 426 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Copper Gas Nozzle Tip -->
    <polygon points="655,408 678,414 674,424 650,418" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
    <!-- Flexible Heavy Power Cable trailing behind -->
    <path d="M540 410 Q480 460 460 550 Q450 600 480 620" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    <path d="M540 410 Q480 460 460 550 Q450 600 480 620" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>

    <!-- 3D Auto-Darkening Welding Helmet -->
    <!-- Main Shell Casting -->
    <path d="M210 110 Q280 65 330 115 L345 180 L310 220 L215 195 L185 150 Z" fill="url(#helmetShell)" stroke="#475569" stroke-width="4"/>
    <!-- Helmet Crown Ridges -->
    <path d="M245 85 Q300 68 330 115" fill="none" stroke="#64748b" stroke-width="3"/>
    <!-- Auto-Darkening Digital Viewing Filter Lens (Visor) -->
    <polygon points="235,135 328,142 322,175 235,168" fill="url(#visorGlow)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Brilliant Arc Reflection in Visor Glass -->
    <polygon points="265,142 315,147 312,168 262,163" fill="#ffffff" opacity="0.8" filter="url(#glowArcHuman)"/>
  </g>

  <!-- ==========================================
       PLASMA ELECTRIC ARC, MOLTEN POOL & SPARKS
       ========================================== -->
  <!-- Molten Weld Bead Pool on Steel Gusset -->
  <path d="M650 412 Q675 422 695 424" stroke="#efad2d" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#glowArcHuman)"/>

  <!-- Multi-layer High Intensity Arc Flash -->
  <circle cx="676" cy="418" r="115" fill="url(#arcCoreHuman)" filter="url(#glowArcHuman)"/>
  <circle cx="676" cy="418" r="48" fill="url(#hotSpotHuman)" filter="url(#glowArcHuman)"/>
  <circle cx="676" cy="418" r="14" fill="#ffffff" filter="url(#glowArcHuman)"/>

  <!-- Electric Plasma Sparks Trajectories -->
  <g fill="#ffe599" stroke="#efad2d" stroke-width="0.8">
    <circle cx="700" cy="390" r="2.5"/>
    <circle cx="725" cy="370" r="1.8"/>
    <circle cx="745" cy="405" r="2.2"/>
    <circle cx="710" cy="440" r="2.0"/>
    <circle cx="690" cy="450" r="1.8"/>
    <circle cx="640" cy="445" r="2.2"/>
    <circle cx="620" cy="425" r="1.5"/>
    <circle cx="770" cy="385" r="1.5"/>
    <circle cx="750" cy="435" r="1.8"/>
  </g>
  <!-- Spark Motion Arcs -->
  <path d="M676 418 Q710 385 745 405" fill="none" stroke="#ffd875" stroke-width="1.2" opacity="0.75"/>
  <path d="M676 418 Q715 440 750 435" fill="none" stroke="#ffd875" stroke-width="1" opacity="0.6"/>
  <path d="M676 418 Q640 450 615 435" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>

  <!-- Light Rim Spill on Welder Coat & Gloves -->
  <path d="M375 330 L345 440" stroke="#ffd875" stroke-width="3" stroke-linecap="round" opacity="0.7" filter="url(#glowArcHuman)"/>
  <path d="M550 375 L580 385 L570 425" stroke="#ffd875" stroke-width="2.5" stroke-linecap="round" opacity="0.8" filter="url(#glowArcHuman)"/>

  <!-- ==========================================
       TECHNICAL HUD & TELEMETRY OVERLAY (3D Engineering Style - Zero Overlap)
       ========================================== -->
  <!-- Left Header Badge & Title -->
  <g transform="translate(42, 36)">
    <rect width="195" height="26" rx="13" fill="#0c1d32" stroke="#efad2d" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="4" fill="#10b981"/>
    <text x="28" y="17" fill="#ffd875" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">MANUAL WELD CELL</text>
    
    <text x="0" y="54" fill="#f8fafc" font-family="'Barlow Condensed', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="0.5">AWS MASTER OPERATOR</text>
  </g>

  <!-- Technical Telemetry Chips in Top Right (Positioned with 340px Clear Gap) -->
  <g transform="translate(660, 36)">
    <rect width="200" height="54" rx="8" fill="#081423" stroke="#10b981" stroke-width="1.2" opacity="0.95"/>
    <circle cx="16" cy="18" r="3.5" fill="#10b981"/>
    <text x="26" y="22" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">MIG / MAG PULSED</text>
    <text x="14" y="41" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">AWS D1.1 / D1.3 CODE</text>
  </g>

</svg>
